[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diko"
version = "0.1.0"
description = "CLI tool for downloading and verifying Linux distribution ISO images"
readme = "README.md"
authors = [{ name = "Alexander", email = "Aledon.job@gmail.com" }]
license = { text = "Apache-2.0" }
keywords = ["iso", "download", "linux", "distribution", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Installation/Setup",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/aleksandr/diko"
Repository = "https://github.com/aleksandr/diko"
Issues = "https://github.com/aleksandr/diko/issues"

[project.scripts]
diko = "diko.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diko*"]

[tool.setuptools.package-data]
diko = ["library.json"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\\.pyi?$'
extend-exclude = '''
/(\
  # directories\
  \\.(eggs|git|hg|mypy_cache|tox|venv)\
  | build\
  | dist\
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true