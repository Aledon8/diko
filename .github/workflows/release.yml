name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Compile Java
      run: |
        cd diko/java && javac Downloader.java
    - name: Run tests
      run: |
        pytest tests/ -v

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        sudo apt-get update
        sudo apt-get install -y debhelper dh-python python3-all python3-setuptools python3-click default-jdk devscripts
    - name: Build package (Python)
      run: python -m build
    - name: Build package (Debian)
      run: |
        # Update version in changelog
        VERSION=${GITHUB_REF#refs/tags/v}
        if [ -n "$VERSION" ]; then
          # Use dch to add a new entry or update the current one
          # We need to set DEBEMAIL and DEBFULLNAME
          export DEBEMAIL="Aledon.job@gmail.com"
          export DEBFULLNAME="Alexander"
          dch -v "${VERSION}-1" --distribution unstable --force-distribution "Release ${VERSION}"
        fi
        
        # Build binary package
        dpkg-buildpackage -us -uc -b
        
        # Move artifacts
        mv ../diko_*.deb dist/
    - name: Check package
      run: twine check dist/*.tar.gz dist/*.whl
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
          dist/*.deb
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}