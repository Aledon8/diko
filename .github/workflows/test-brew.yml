name: Test Homebrew Formula

on:
  push:
    branches: [ main ]
    paths:
      - 'Formula/**'
      - '.github/workflows/test-brew.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Formula/**'

jobs:
  test-formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Audit Formula
        run: brew audit --new-formula Formula/diko.rb

      - name: Install Formula (Build from Source)
        run: |
          # We need to simulate the release tarball for the formula to install
          # Since the tag v0.1.0 might not exist yet, we can create a local tarball
          # and modify the formula to point to it, OR just skip installation if SHA mismatch
          
          # For now, just run audit. Installation requires valid URL/SHA.
          echo "Skipping install test until release v0.1.0 is created."
